[package]
name = "ut"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A task runner for uv workspaces"
repository = "https://github.com/krzkaczor/uv-tasks"

[dependencies]
anyhow = "1.0.104"
glob = "0.3.4"
owo-colors = "4.4.0"
pep508_rs = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
usage = { version = "6", package = "usage-rs", features = ["completions"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
usage = { version = "6", package = "usage-rs", features = ["test"] }
